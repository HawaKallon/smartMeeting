services:
  db:
    image: postgres:17
    container_name: smart_meeting_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: hawakallon
      POSTGRES_DB: smart_meeting
      # DATABASE_URL has no password -> allow passwordless local connections
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5433:5432"
    volumes:
      - smart_meeting_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hawakallon -d smart_meeting"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  smart_meeting_pgdata:
